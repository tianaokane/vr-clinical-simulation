<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AR/VR First Aid — Scenario Logic Test</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #eef1f4; color: #111827; padding: 16px; font-size: 13px; }
        .monitor {
            display: grid;
            grid-template-columns: minmax(360px, 1.2fr) minmax(320px, 0.9fr) minmax(360px, 1fr);
            gap: 12px;
            max-width: 1600px;
            margin: 0 auto;
            align-items: start;
        }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; }
        .header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; }
        .dot { width: 9px; height: 9px; border-radius: 50%; background: #dc2626; flex-shrink: 0; }
        .dot.live { background: #16a34a; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .status-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .patient { font-size: 15px; font-weight: 700; }
        .scenario { font-size: 12px; color: #64748b; margin-top: 1px; }
        .elapsed { margin-left: auto; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border: 1px solid transparent; }
        .badge-red { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
        .badge-green { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }
        .badge-blue { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
        .toolbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        select, button { font: inherit; font-size: 12px; border-radius: 7px; border: 1px solid #cbd5e1; background: #f8fafc; color: #334155; padding: 7px 10px; cursor: pointer; }
        button:hover, select:hover { background: #f1f5f9; }
        button:active { transform: scale(0.98); }
        .btn-primary { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; font-weight: 700; }
        .btn-green { background: #f0fdf4; border-color: #86efac; color: #15803d; font-weight: 700; }
        .btn-danger { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; font-weight: 700; }
        .section-title { font-size: 10px; font-weight: 800; color: #64748b; letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; }
        .vitals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 8px; }
        .vital { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px 12px; position: relative; overflow: hidden; min-height: 86px; }
        .vital-label { font-size: 10px; font-weight: 800; color: #94a3b8; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 7px; }
        .vital-value { font-size: 28px; font-weight: 850; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
        .vital-value.text { font-size: 18px; line-height: 1.15; }
        .vital-unit { font-size: 10px; color: #94a3b8; margin-top: 4px; }
        .vital-bar { position: absolute; bottom: 0; left: 0; height: 3px; transition: width 0.4s, background-color 0.4s; }
        .v-ok { color: #16a34a; }
        .v-warn { color: #d97706; }
        .v-crit { color: #dc2626; }
        .v-neutral { color: #111827; }
        .skin-row { margin-top: 8px; display: none; align-items: center; gap: 8px; padding: 9px 10px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
        .skin-label { font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .right-panel {
                display: contents;
            }
        .step { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f8fafc; }
        .step-num { width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid #cbd5e1; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; flex-shrink: 0; }
        .step-num.done { background: #16a34a; border-color: #16a34a; color: #fff; }
        .step-num.active { background: #2563eb; border-color: #2563eb; color: #fff; }
        .step-label { font-size: 12px; font-weight: 750; color: #64748b; }
        .step-label.done { color: #94a3b8; text-decoration: line-through; font-weight: 500; }
        .step-label.active { color: #2563eb; }
        .step-hint { font-size: 10px; color: #94a3b8; margin-top: 2px; line-height: 1.25; }
        .step-divider, .group-label { font-size: 9px; font-weight: 900; color: #cbd5e1; letter-spacing: 1px; text-transform: uppercase; padding: 8px 0 3px; }
        .actions-group { margin-bottom: 10px; }
        .btn-row { display: flex; gap: 5px; flex-wrap: wrap; }
        .log-panel { grid-column: 1 / -1; }
        .log {
            height: 120px;
            overflow-y: auto;
            font-size: 11px;
            font-family: 'SF Mono', Consolas, monospace;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .log-entry { display: flex; gap: 9px; padding: 3px 0; border-bottom: 1px solid #f8fafc; }
        .log-t { color: #94a3b8; min-width: 48px; flex-shrink: 0; }
        .log-msg { color: #64748b; }
        .log-ok { color: #16a34a; }
        .log-warn { color: #d97706; }
        .log-err { color: #dc2626; }
        .log-info { color: #2563eb; }
        .small-note { font-size: 11px; color: #64748b; line-height: 1.35; }
        .scroll-panel {
            max-height: 520px;
            overflow-y: auto;
        }

        .actions-scroll {
            max-height: 520px;
            overflow-y: auto;
        }

        .actions-group {
            margin-bottom: 8px;
        }

        .btn-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 6px;
        }

        .btn-row button {
            width: 100%;
            text-align: left;
            line-height: 1.2;
        }

        .dialogue-panel {
            grid-column: 1 / -1;
        }

        .dialogue-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            gap: 8px;
            align-items: center;
        }

        .dialogue-row input {
            font: inherit;
            font-size: 12px;
            border-radius: 7px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
            padding: 8px 10px;
        }

        .dialogue-output {
            margin-top: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            min-height: 42px;
            font-size: 13px;
            color: #334155;
        }

        .dialogue-speaker {
            font-size: 10px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .dialogue-text {
            line-height: 1.35;
        }

        @media (max-width: 1100px) {
            .monitor {
                grid-template-columns: 1fr;
            }

            .scroll-panel,
            .actions-scroll {
                max-height: none;
            }
        }
    </style>
</head>
<body>
<div class="monitor">
    <div class="header card">
        <div class="dot" id="dot"></div>
        <div>
            <div class="status-label" id="statusText">Stopped</div>
            <div class="patient" id="patientLabel">—</div>
            <div class="scenario" id="scenarioLabel">—</div>
        </div>
        <span id="rhythmBadge" class="badge badge-red" style="display:none">—</span>
        <div class="elapsed" id="timeDisplay">t=0s</div>
    </div>

    <div class="toolbar card">
        <label class="status-label" for="scenarioSelect">Scenario</label>
        <select id="scenarioSelect"></select>
        <button class="btn-primary" id="btnLoadScenario">Load</button>
        <button class="btn-green" id="btnStart">▶ Start</button>
        <button id="btnStop">■ Stop</button>
        <button id="btnReset">↺ Reset</button>
        <span class="small-note">This is a developer logic dashboard. Final VR should show only learner-visible clinical information.</span>
    </div>

   <div class="card">
        <div class="section-title">Physiology / debug state</div>
        <div class="vitals-grid" id="vitalsGrid"></div>
        <div class="skin-row" id="skinAssessment">
            <span class="skin-label">Assessment</span>
            <span id="skinSiteText" style="font-size:11px;color:#334155"></span>
        </div>
    </div>

    <div class="card scroll-panel">
        <div class="section-title">Scenario protocol</div>
        <div id="stepList"></div>
    </div>

    <div class="card actions-scroll">
        <div class="section-title">Scenario actions</div>
        <div id="actionsList"></div>
    </div>

    <div class="dialogue-panel card">
        <div class="section-title">Patient dialogue test</div>

        <div class="dialogue-row">
            <input id="dialogueInput" type="text" placeholder="Ask the patient something, e.g. Where does it hurt?">
            <button class="btn-primary" id="btnSendDialogue">Send</button>
            <button id="btnProactiveDialogue">Proactive line</button>
        </div>

        <div class="dialogue-output">
            <div class="dialogue-speaker">Patient response</div>
            <div class="dialogue-text" id="dialogueOutput">Load a scenario and ask the patient a question.</div>
        </div>
    </div>

    <div class="log-panel card">
        <div class="section-title">Event log</div>
        <div class="log" id="eventLog"></div>
    </div>
</div>

<script type="module">
    import { PatientStateModel } from './core/PatientStateModel.js'
    import { DialogueEngine } from './core/DialogueEngine.js'
    import { CPRQualityAnalyzer } from './core/CPRQualityAnalyzer.js'

    // Add every scenario JSON here. The dashboard is generic after this.
    // You can also load a specific scenario using: index.html?scenario=-fractued-femur-adult
    const scenarioFiles = [
        'cardiac-arrest-adult',
        'fractured-femur-adult',
        'anaphylaxis-paediatric',
        'sepsis-adult'
    ]

    let scenario = null
    let model = null
    let dialogueEngine = null
    let completed = new Set()
    let orderedSteps = []
    let spokenActionDialogue = new Set()

    let lastProactiveDialogueAt = 0
    const proactiveDialogueCooldownSeconds = 20

    const els = {
        dot: document.getElementById('dot'),
        statusText: document.getElementById('statusText'),
        patientLabel: document.getElementById('patientLabel'),
        scenarioLabel: document.getElementById('scenarioLabel'),
        rhythmBadge: document.getElementById('rhythmBadge'),
        timeDisplay: document.getElementById('timeDisplay'),
        scenarioSelect: document.getElementById('scenarioSelect'),
        vitalsGrid: document.getElementById('vitalsGrid'),
        skinAssessment: document.getElementById('skinAssessment'),
        skinSiteText: document.getElementById('skinSiteText'),
        stepList: document.getElementById('stepList'),
        actionsList: document.getElementById('actionsList'),
        eventLog: document.getElementById('eventLog'),
        dialogueInput: document.getElementById('dialogueInput'),
        btnSendDialogue: document.getElementById('btnSendDialogue'),
        btnProactiveDialogue: document.getElementById('btnProactiveDialogue'),
        dialogueOutput: document.getElementById('dialogueOutput')
    }

    for (const id of scenarioFiles) {
        const option = document.createElement('option')
        option.value = id
        option.textContent = id
        els.scenarioSelect.appendChild(option)
    }

    const requestedScenario = new URLSearchParams(window.location.search).get('scenario')
    if (requestedScenario && scenarioFiles.includes(requestedScenario)) {
        els.scenarioSelect.value = requestedScenario
    }

    await loadScenario(els.scenarioSelect.value)

    document.getElementById('btnLoadScenario').addEventListener('click', async () => {
        await loadScenario(els.scenarioSelect.value)
    })

    document.getElementById('btnStart').addEventListener('click', () => {
        const result = model.start()
        if (result.ok) {
            els.dot.classList.add('live')
            els.statusText.textContent = 'Running'
            addLog('Simulation started', 'info')
        }
        updateAll()
    })

    document.getElementById('btnStop').addEventListener('click', () => {
        model.stop('manual_stop')
        els.dot.classList.remove('live')
        els.statusText.textContent = 'Stopped manually'
        updateAll()
    })

    document.getElementById('btnReset').addEventListener('click', async () => {
        await loadScenario(els.scenarioSelect.value)
    })

    els.btnSendDialogue.addEventListener('click', () => {
        sendDialogueMessage()
    })

    els.dialogueInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            sendDialogueMessage()
        }
    })

    els.btnProactiveDialogue.addEventListener('click', () => {
        generateProactiveDialogue()
    })

    async function loadScenario(id) {
    if (model?.isRunning) model.stop('scenario_reload')

    try {
        const response = await fetch(`./scenarios/${id}.json`, { cache: 'no-store' })
        if (!response.ok) throw new Error(`${response.status} ${response.statusText}`)

        const scenarioText = await response.text()

        if (!scenarioText.trim()) {
            throw new Error(`Scenario file is empty: ./scenarios/${id}.json`)
        }

        try {
            scenario = JSON.parse(scenarioText)
        } catch (jsonError) {
            throw new Error(`Invalid JSON in ./scenarios/${id}.json: ${jsonError.message}`)
        }

        model = new PatientStateModel(scenario)
        window.model = model
        window.scenario = scenario
        completed = new Set()
        spokenActionDialogue = new Set()
        lastProactiveDialogueAt = 0

        const dialogueResponse = await fetch(`./dialogue/${id}-dialogue.json`, { cache: 'no-store' })

        if (dialogueResponse.ok) {
            const dialogueText = await dialogueResponse.text()

            if (!dialogueText.trim()) {
                throw new Error(`Dialogue file is empty: ./dialogue/${id}-dialogue.json`)
            }

            try {
                const dialogueData = JSON.parse(dialogueText)
                dialogueEngine = new DialogueEngine(dialogueData, model)
                window.dialogueEngine = dialogueEngine
            } catch (jsonError) {
                throw new Error(`Invalid JSON in ./dialogue/${id}-dialogue.json: ${jsonError.message}`)
            }
        } else {
            dialogueEngine = null
            window.dialogueEngine = null
        }

        patchTickForUI()
        renderScenarioHeader()
        renderChecklist()
        renderActions()
        updateAll()

        els.dot.classList.remove('live')
        els.statusText.textContent = 'Stopped'
        clearLog()
        addLog(`Scenario loaded: ${scenario.scenarioName ?? scenario.scenarioId ?? id}`, 'info')
        addLog(`Patient: ${patientText()}`, 'msg')

        els.dialogueOutput.textContent = dialogueEngine
            ? 'Dialogue loaded. Ask the patient a question.'
            : 'No dialogue file loaded for this scenario.'

        if (dialogueEngine) {
            addLog(`Dialogue loaded: ${id}-dialogue.json`, 'info')
        } else {
            addLog(`No dialogue file found for ${id}`, 'warn')
        }
    } catch (err) {
        addLog(`Could not load scenario '${id}': ${err.message}`, 'err')
        console.error(err)
    }
}

    function patchTickForUI() {
        const originalTick = model._tick.bind(model)

        model._tick = function () {
            originalTick()
            updateAll()
            maybeTriggerProactiveDialogue()

            if (!model.isRunning) {
                els.dot.classList.remove('live')
                updateStatusFromModel()
            }
        }
    }

    function updateStatusFromModel() {
        const outcome = model?.getScenarioOutcome?.()

        if (!outcome) {
            els.statusText.textContent = model?.isRunning ? 'Running' : 'Stopped'
            return
        }

        if (outcome.type === 'success') {
            els.statusText.textContent = `Completed — ${outcome.title}`
            return
        }

        if (outcome.type === 'failure') {
            els.statusText.textContent = `Ended — ${outcome.title}`
            return
        }

        els.statusText.textContent = outcome.title ?? 'Completed'
    }

    function renderScenarioHeader() {
        els.patientLabel.textContent = patientText()
        els.scenarioLabel.textContent = scenario.scenarioName ?? scenario.scenarioId ?? 'Untitled scenario'
        updateRhythm()
    }

    function patientText() {
        const p = scenario?.patient ?? {}
        const name = p.name ?? 'Unnamed patient'
        const age = p.age !== undefined ? `${p.age}` : '—'
        const sex = p.sex ? String(p.sex)[0].toUpperCase() : '—'
        return `${name} · ${age}${sex}`
    }

    function renderChecklist() {
        els.stepList.innerHTML = ''
        const actions = scenario.actionMappings ?? {}
        const required = scenario.requiredActions ?? Object.keys(actions).sort((a, b) => (actions[a].sequence ?? 999) - (actions[b].sequence ?? 999))
        orderedSteps = required.map(id => ({ id, action: actions[id] ?? { label: id } }))

        if (!orderedSteps.length) {
            els.stepList.innerHTML = '<p class="small-note">No requiredActions defined for this scenario.</p>'
            return
        }

        let lastGroup = null
        orderedSteps.forEach((step, index) => {
            const group = step.action.group ?? step.action.phase ?? step.action.category ?? null
            if (group && group !== lastGroup) {
                const divider = document.createElement('div')
                divider.className = 'step-divider'
                divider.textContent = group
                els.stepList.appendChild(divider)
                lastGroup = group
            }

            const div = document.createElement('div')
            div.className = 'step'
            div.dataset.stepId = step.id
            div.innerHTML = `
                <div class="step-num ${index === 0 ? 'active' : ''}" id="num_${cssSafe(step.id)}">${index + 1}</div>
                <div>
                    <div class="step-label ${index === 0 ? 'active' : ''}" id="lbl_${cssSafe(step.id)}">${step.action.label ?? step.id}</div>
                    <div class="step-hint">${step.action.instruction ?? step.action.hint ?? ''}</div>
                </div>`
            els.stepList.appendChild(div)
        })
    }

    function renderActions() {
        els.actionsList.innerHTML = ''
        const actions = scenario.actionMappings ?? {}
        const entries = Object.entries(actions).sort(([, a], [, b]) => (a.sequence ?? 999) - (b.sequence ?? 999))

        if (!entries.length) {
            els.actionsList.innerHTML = '<p class="small-note">No actionMappings defined for this scenario.</p>'
            return
        }

        const groups = new Map()
        for (const [id, action] of entries) {
            const group = action.group ?? action.phase ?? action.category ?? inferGroup(id, action)
            if (!groups.has(group)) groups.set(group, [])
            groups.get(group).push([id, action])
        }

        // Actions that don't author their own qualityEffects but are still
        // physically "CPR" (e.g. resuming compressions after a shock) reuse
        // cprCompressions' target ranges, since it's the same technique.
        const CPR_LIKE_ACTION_IDS = ['cprCompressions', 'continueCPRAfterShock']
        function qualityEffectsFor(id, action) {
            return action.qualityEffects ?? (CPR_LIKE_ACTION_IDS.includes(id) ? actions['cprCompressions']?.qualityEffects : null)
        }

        for (const [group, groupActions] of groups.entries()) {
            const wrapper = document.createElement('div')
            wrapper.className = 'actions-group'

            const label = document.createElement('div')
            label.className = 'group-label'
            label.textContent = group
            wrapper.appendChild(label)

            const row = document.createElement('div')
            row.className = 'btn-row'

            for (const [id, action] of groupActions) {
                const qualityEffects = qualityEffectsFor(id, action)

                if (qualityEffects) {
                    row.appendChild(buildMeasuredCPRControl(id, action, qualityEffects))
                    continue
                }

                const button = document.createElement('button')
                button.textContent = action.label ?? id
                button.title = action.instruction ?? ''
                button.className = buttonClassFor(id, action)
                button.addEventListener('click', () => runAction(id, action.defaultQuality ?? 1.0))
                row.appendChild(button)

                if (action.allowQualityTest !== false && !action.completionOnly) {
                    const poor = document.createElement('button')
                    poor.textContent = `${action.label ?? id} — poor`
                    poor.title = 'Test this action with qualityScore 0.4'
                    poor.addEventListener('click', () => runAction(id, 0.4))
                    row.appendChild(poor)
                }
            }

            wrapper.appendChild(row)
            els.actionsList.appendChild(wrapper)
        }
    }

    // Builds the rate/depth-driven control for a CPR-measurable action.
    // Instead of a hardcoded qualityScore, this computes a real quality
    // value from measured compression rate/depth via CPRQualityAnalyzer,
    // scored against the scenario's own qualityEffects target ranges.
    // This is the manual stand-in for a future VR hand-tracking / CV
    // pipeline — whatever eventually supplies real rate/depth samples
    // plugs into the same CPRQualityAnalyzer.scoreCompression() call.
    function buildMeasuredCPRControl(id, action, qualityEffects) {
        const rateRange = qualityEffects.rateTargetPerMinute ?? {}
        const depthRange = qualityEffects.depthTargetCm ?? {}
        const rateMid = ((rateRange.min ?? 100) + (rateRange.max ?? 120)) / 2
        const depthMid = ((depthRange.min ?? 5) + (depthRange.max ?? 6)) / 2

        const wrapper = document.createElement('div')
        wrapper.className = 'cpr-quality-control'
        wrapper.style.cssText = 'display:flex; align-items:center; gap:6px; flex-wrap:wrap; border:1px solid #3a3a3a; border-radius:6px; padding:6px 8px; margin:2px 0;'

        const title = document.createElement('span')
        title.textContent = action.label ?? id
        title.title = action.instruction ?? ''
        title.style.cssText = 'font-weight:600; margin-right:4px;'
        wrapper.appendChild(title)

        const rateInput = document.createElement('input')
        rateInput.type = 'number'
        rateInput.value = Math.round(rateMid)
        rateInput.step = 1
        rateInput.style.width = '64px'
        rateInput.title = 'Measured compression rate (per minute)'

        const rateLbl = document.createElement('label')
        rateLbl.textContent = 'rate/min'
        rateLbl.style.cssText = 'font-size:11px; display:flex; align-items:center; gap:3px;'
        rateLbl.appendChild(rateInput)
        wrapper.appendChild(rateLbl)

        const depthInput = document.createElement('input')
        depthInput.type = 'number'
        depthInput.value = depthMid
        depthInput.step = 0.1
        depthInput.style.width = '56px'
        depthInput.title = 'Measured compression depth (cm)'

        const depthLbl = document.createElement('label')
        depthLbl.textContent = 'depth cm'
        depthLbl.style.cssText = 'font-size:11px; display:flex; align-items:center; gap:3px;'
        depthLbl.appendChild(depthInput)
        wrapper.appendChild(depthLbl)

        const scoreAndRun = (ratePerMinute, depthCm) => {
            const quality = CPRQualityAnalyzer.scoreCompression({ ratePerMinute, depthCm }, qualityEffects)
            addLog(`${action.label ?? id}: measured ${ratePerMinute}/min @ ${depthCm}cm → quality ${quality.toFixed(2)}`, 'info')
            runAction(id, quality)
        }

        const applyBtn = document.createElement('button')
        applyBtn.textContent = 'Apply measured'
        applyBtn.className = buttonClassFor(id, action)
        applyBtn.addEventListener('click', () => {
            scoreAndRun(Number(rateInput.value), Number(depthInput.value))
        })
        wrapper.appendChild(applyBtn)

        // Quick presets — these still go through the real analyzer rather
        // than a hardcoded quality number, they just supply representative
        // good/poor rate-depth pairs so testing doesn't require typing.
        const goodBtn = document.createElement('button')
        goodBtn.textContent = 'Good technique'
        goodBtn.title = 'Preset: rate/depth centred in target range'
        goodBtn.addEventListener('click', () => scoreAndRun(rateMid, depthMid))
        wrapper.appendChild(goodBtn)

        const poorBtn = document.createElement('button')
        poorBtn.textContent = 'Poor technique'
        poorBtn.title = 'Preset: rate/depth well outside target range'
        poorBtn.addEventListener('click', () => {
            const poorRate = Math.max(20, (rateRange.min ?? 100) - 40)
            const poorDepth = Math.max(0.5, (depthRange.min ?? 5) - 3)
            scoreAndRun(poorRate, poorDepth)
        })
        wrapper.appendChild(poorBtn)

        return wrapper
    }

    function dialogueActionFor(actionId, action = {}) {
        const id = String(actionId).toLowerCase()
        const label = String(action.label ?? '').toLowerCase()
        const text = `${id} ${label}`

        // ------------------------------------------------------------
        // Actions that should NOT trigger patient speech
        // ------------------------------------------------------------
        // These are clinician/team/process actions, not direct patient interactions.
        if (
            text.includes('monitor vitals') ||
            text.includes('monitoring') ||
            text.includes('attach monitoring') ||
            text.includes('attach ed monitoring') ||
            text.includes('attach pulse oximeter') ||
            text.includes('attach bp cuff') ||
            text.includes('ecg') ||
            text.includes('sbar') ||
            text.includes('atmist') ||
            text.includes('handover') ||
            text.includes('aftercare') ||
            text.includes('plan observation') ||
            text.includes('recognise') ||
            text.includes('recognize') ||
            text.includes('call senior') ||
            text.includes('call crash team') ||
            text.includes('call senior / paediatric') ||
            text.includes('call senior / sepsis') ||
            text.includes('request imaging') ||
            text.includes('orthopaedics') ||
            text.includes('request iv antibiotics') ||
            text.includes('send bloods') ||
            text.includes('take blood cultures') ||
            text.includes('prepare fluid') ||
            text.includes('prepare iv fluids') ||
            text.includes('prepare shock escalation') ||
            text.includes('consider critical care') ||
            text.includes('consider antihistamine') ||
            text.includes('consider steroid') ||
            text.includes('diagnosis') ||
            text.includes('reassessment') && !text.includes('adrenaline')
            // (text.includes('reassessment') && !text.includes('adrenaline')) (if issues)
        ) {
            return null
        }

        // ------------------------------------------------------------
        // Fractured femur — painful / unsafe limb handling
        // ------------------------------------------------------------
        if (
            text.includes('move injured leg') ||
            text.includes('straighten injured leg') ||
            text.includes('ask patient to stand') ||
            text.includes('stand/walk') ||
            text.includes('weight-bearing') ||
            text.includes('palpate') ||
            text.includes('check distal pulse') ||
            text.includes('check capillary refill') ||
            text.includes('check foot sensation') ||
            text.includes('check toe movement')
        ) {
            return "legTouched"
        }

        // Fractured femur — supportive care
        if (
            text.includes('support limb') ||
            text.includes('support leg') ||
            text.includes('immobilise') ||
            text.includes('immobilize') ||
            text.includes('pad around limb') ||
            text.includes('splint')
        ) {
            return "splintOrImmobilisationApplied"
        }

        // ------------------------------------------------------------
        // Anaphylaxis — direct patient-facing actions
        // ------------------------------------------------------------
        if (
            text.includes('give high-flow oxygen') ||
            text.includes('oxygen therapy') ||
            text.includes('give oxygen')
        ) {
            return "oxygenApplied"
        }

        if (
            text.includes('give im adrenaline') ||
            text.includes('second im adrenaline') ||
            text.includes('administer adrenaline') ||
            text.includes('epipen') ||
            text.includes('auto-injector')
        ) {
            return "imAdrenalineGiven"
        }

        if (
            text.includes('reassess abc after adrenaline')
        ) {
            return "afterAdrenalineReassess"
        }

        // ------------------------------------------------------------
        // Sepsis — direct patient-facing actions
        // ------------------------------------------------------------
        if (
            text.includes('establish iv access')
        ) {
            return "monitoringAttached"
        }

        if (
            text.includes('give iv fluids') ||
            text.includes('fluid bolus')
        ) {
            return "fluidsGiven"
        }

        if (
            text.includes('administer antibiotics')
        ) {
            return "antibioticsGiven"
        }

        if (
            text.includes('give oxygen if hypoxic') ||
            text.includes('give oxygen')
        ) {
            return "oxygenApplied"
        }

        // ------------------------------------------------------------
        // Cardiac arrest
        // ------------------------------------------------------------
        // Most arrest actions should not trigger patient speech.
        // DialogueEngine already prevents speech during arrest, but we also avoid
        // unnecessary action-triggered dialogue here.
        if (
            id === "checkresponse" ||
            text.includes('check response')
        ) {
            return "checkResponse"
        }

        if (
            text.includes('oxygen therapy') ||
            text.includes('post-rosc oxygen')
        ) {
            return "oxygenApplied"
        }

        return null
    }

    function triggerDialogueForAction(actionId, action = {}) {
        if (!dialogueEngine) return

        const dialogueAction = dialogueActionFor(actionId, action)
        if (!dialogueAction) return

        const dialogueKey = `${els.scenarioSelect.value}:${actionId}:${dialogueAction}`

        // Prevent repeated speech from the same action in one scenario run.
        if (spokenActionDialogue.has(dialogueKey)) {
            return
        }

        const response = dialogueEngine.respondToTrainee(
            `[action:${actionId}]`,
            null,
            { action: dialogueAction }
        )

        if (response) {
            const elapsed = model?._elapsedSeconds?.() ?? 0
            lastProactiveDialogueAt = elapsed
            spokenActionDialogue.add(dialogueKey)

            els.dialogueOutput.textContent = response
            addLog(`Patient: ${response}`, 'info')
        } else {
            spokenActionDialogue.add(dialogueKey)
            els.dialogueOutput.textContent = 'No verbal response.'
        }
    }

    function maybeTriggerProactiveDialogue() {
        if (!model?.isRunning || !dialogueEngine) return

        const elapsed = model._elapsedSeconds?.() ?? 0

        if (elapsed - lastProactiveDialogueAt < proactiveDialogueCooldownSeconds) {
            return
        }

        const state = dialogueEngine.getCurrentState()
        const stateCategory = dialogueEngine.getStateCategory(state)

        let reason = null
        const scenarioId = scenario?.scenarioId ?? scenario?.id ?? els.scenarioSelect.value

        if (stateCategory === "critical" || stateCategory === "deteriorating") {
            if (scenarioId.includes("anaphylaxis")) {
                reason = "breathingWorsening"
            } else if (scenarioId.includes("sepsis")) {
                reason = "confusionWorsening"
            } else {
                reason = "shockWorsening"
            }
        } else {
            return
        }

        const response = dialogueEngine.generateProactiveLine(state, reason)

        if (!response) return

        lastProactiveDialogueAt = elapsed
        els.dialogueOutput.textContent = response
        addLog(`Patient: ${response}`, 'info')
    }

    function runAction(actionId, quality) {
        const result = model.applyAction(actionId, quality)

        if (result?.ok) {
    markStep(actionId)
            if (result.message) addLog(result.message, 'info')
            const action = scenario.actionMappings?.[actionId] ?? {}
            triggerDialogueForAction(actionId, action)
        } else {
            addLog(result?.message ?? `Action failed: ${actionId}`, 'warn')
        }

        updateAll()
    }

    function sendDialogueMessage() {
        if (!dialogueEngine) {
            const msg = 'No dialogue engine loaded for this scenario.'
            els.dialogueOutput.textContent = msg
            addLog(msg, 'warn')
            return
        }

        const traineeText = els.dialogueInput.value.trim()

        if (!traineeText) {
            return
        }

        const response = dialogueEngine.respondToTrainee(traineeText)

        addLog(`Trainee: ${traineeText}`, 'msg')

        if (response) {
            els.dialogueOutput.textContent = response
            addLog(`Patient: ${response}`, 'info')
        } else {
            els.dialogueOutput.textContent = 'No verbal response.'
            addLog('Patient: No verbal response.', 'info')
        }

        els.dialogueInput.value = ''
    }

    function generateProactiveDialogue() {
        if (!dialogueEngine) {
            const msg = 'No dialogue engine loaded for this scenario.'
            els.dialogueOutput.textContent = msg
            addLog(msg, 'warn')
            return
        }

        const response = dialogueEngine.generateProactiveLine()

        if (response) {
            els.dialogueOutput.textContent = response
            addLog(`Patient: ${response}`, 'info')
        } else {
            els.dialogueOutput.textContent = 'No verbal response.'
            addLog('Patient: No verbal response.', 'info')
        }
    }

    function markStep(id) {
        if (completed.has(id)) return
        completed.add(id)

        const num = document.getElementById(`num_${cssSafe(id)}`)
        const lbl = document.getElementById(`lbl_${cssSafe(id)}`)
        if (num) { num.className = 'step-num done'; num.textContent = '✓' }
        if (lbl) lbl.className = 'step-label done'

        const next = orderedSteps.find(step => !completed.has(step.id))
        if (next) {
            const n = document.getElementById(`num_${cssSafe(next.id)}`)
            const l = document.getElementById(`lbl_${cssSafe(next.id)}`)
            if (n && !n.classList.contains('done')) n.className = 'step-num active'
            if (l && !l.classList.contains('done')) l.className = 'step-label active'
        }
    }

    function updateAll() {
        updateVitals()
        updateRhythm()
        els.timeDisplay.textContent = `t=${model?._elapsedSeconds?.() ?? 0}s`
    }

    function updateVitals() {
        if (!model) return
        els.vitalsGrid.innerHTML = ''
        const params = model.getDisplayParameters({ includeHidden: true })

        for (const param of params) {
            const card = document.createElement('div')
            card.className = 'vital'

            const valueInfo = formatValue(param)
            card.innerHTML = `
                <div class="vital-label">${param.label ?? param.id}</div>
                <div class="vital-value ${valueInfo.isText ? 'text' : ''} ${classForParam(param)}">${valueInfo.text}</div>
                <div class="vital-unit">${param.unit ?? ''}</div>
                <div class="vital-bar" style="width:${barPercent(param)}%; background:${barColour(param)}"></div>`
            els.vitalsGrid.appendChild(card)
        }

        const skin = model.parameters?.skinColour?.value
        if (skin?.assessmentSite && skin.state !== 'normal') {
            els.skinAssessment.style.display = 'flex'
            els.skinSiteText.textContent = skin.assessmentSite
        } else {
            els.skinAssessment.style.display = 'none'
        }
    }

    function updateRhythm() {
        if (!model) return
        els.rhythmBadge.style.display = 'inline-flex'
        const rhythm = model.rhythmState ?? 'unknown'
        els.rhythmBadge.textContent = rhythm
        els.rhythmBadge.className = rhythm === 'rosc'
            ? 'badge badge-green'
            : rhythm === 'arrest'
                ? 'badge badge-red'
                : 'badge badge-blue'
    }

    function formatValue(param) {
        if (param.id === 'skinColour') {
            return { text: param.value?.state ?? 'normal', isText: true }
        }

        if (param.value === null || param.value === undefined) return { text: '—', isText: true }
        if (typeof param.value === 'number') {
            const decimals = param.decimals ?? 1
            return { text: param.value.toFixed(decimals), isText: false }
        }
        return { text: String(param.value), isText: true }
    }

    function classForParam(param) {
        if (typeof param.value !== 'number') return 'v-neutral'
        if (param.criticalBelow !== null && param.value <= param.criticalBelow) return 'v-crit'
        if (param.criticalAbove !== null && param.value >= param.criticalAbove) return 'v-crit'

        if (Number.isFinite(param.min) && Number.isFinite(param.max)) {
            const pct = (param.value - param.min) / (param.max - param.min)
            if (pct < 0.3) return 'v-warn'
        }

        return 'v-ok'
    }

    function barPercent(param) {
        if (typeof param.value !== 'number') return 0
        if (!Number.isFinite(param.min) || !Number.isFinite(param.max) || param.max === param.min) return 50
        return Math.max(0, Math.min(100, ((param.value - param.min) / (param.max - param.min)) * 100))
    }

    function barColour(param) {
        const cls = classForParam(param)
        if (cls === 'v-crit') return '#dc2626'
        if (cls === 'v-warn') return '#d97706'
        if (cls === 'v-ok') return '#16a34a'
        return '#cbd5e1'
    }

    function inferGroup(id, action) {
        const text = `${id} ${action.label ?? ''}`.toLowerCase()
        if (text.includes('cpr') || text.includes('compression') || text.includes('breath')) return 'CPR / ventilation'
        if (text.includes('aed') || text.includes('shock') || text.includes('defib')) return 'Defibrillation'
        if (text.includes('oxygen') || text.includes('recovery') || text.includes('monitor')) return 'Post-event care'
        if (text.includes('call')) return 'Call for help'
        if (text.includes('airway') || text.includes('breathing') || text.includes('response')) return 'Assessment'
        return 'Actions'
    }

    function buttonClassFor(id, action) {
        const text = `${id} ${action.label ?? ''}`.toLowerCase()
        if (text.includes('oxygen') || text.includes('recovery') || text.includes('monitor')) return 'btn-green'
        if (text.includes('shock') || text.includes('defib') || text.includes('aed') || text.includes('cpr')) return 'btn-primary'
        if (action.dangerousTestAction) return 'btn-danger'
        return ''
    }

    function addLog(msg, type = 'msg') {
        const t = model?.isRunning ? `t=${model._elapsedSeconds()}s` : '—'
        const e = document.createElement('div')
        e.className = 'log-entry'
        e.innerHTML = `<span class="log-t">${t}</span><span class="log-${type}">${escapeHtml(String(msg))}</span>`
        els.eventLog.appendChild(e)
        els.eventLog.scrollTop = els.eventLog.scrollHeight
    }

    function clearLog() {
        els.eventLog.innerHTML = ''
    }

    const nativeLog = console.log.bind(console)
    const nativeWarn = console.warn.bind(console)
    console.log = (...args) => {
        nativeLog(...args)
        const msg = args.join(' ')
        if (msg.includes('[action]')) addLog(msg, 'ok')
        else if (msg.includes('[rhythm]')) addLog(msg, 'info')
        else if (msg.includes('[scenario outcome]')) addLog(msg, 'info')
        else if (!msg.includes('[t=')) addLog(msg, 'msg')
    }
    console.warn = (...args) => {
        nativeWarn(...args)
        addLog(args.join(' '), 'warn')
    }

    function cssSafe(id) {
        return String(id).replace(/[^a-zA-Z0-9_-]/g, '_')
    }

    function escapeHtml(str) {
        return str
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;')
    }
</script>
</body>
